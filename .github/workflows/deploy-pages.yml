name: Build full free mathematics site
on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mathgenius-free-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Build complete static site
        env:
          SITE_URL: https://tajogood.github.io/mathgenius_fr/
        run: npm run build
      - name: Validate all math exercises
        run: npm test
      - name: Validate all educational UI
        run: npm run test:ui
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Validate GitHub Pages base URL and all grade lessons
        run: npm run test:viewport
      - name: Verify static output
        run: |
          test -s dist/index.html
          test -s dist/sitemap.xml
          test -s dist/robots.txt
          test -f dist/.nojekyll
          grep -q '/mathgenius_fr/assets/' dist/index.html
      - name: Publish tested build to staging and GitHub Pages main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          git init -b site-build
          git config user.name "MathGenius Free Build"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: all original lessons and SEO pages from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/site-build
          git push --force origin HEAD:refs/heads/main
      - name: Check Cloudflare Pages production build and SEO domain
        env:
          CF_PAGES: '1'
          CF_PAGES_BRANCH: source
          SITE_URL: https://mathgenius-b0c.pages.dev/
        run: |
          npm run build
          grep -q 'https://mathgenius-b0c.pages.dev/' dist/sitemap.xml
          grep -q 'https://mathgenius-b0c.pages.dev/' dist/robots.txt
          grep -q 'rel="canonical" href="https://mathgenius-b0c.pages.dev/"' dist/index.html
          grep -q '/assets/' dist/index.html
          if grep -q '/mathgenius_fr/assets/' dist/index.html; then exit 1; fi
          if grep -q 'd88a528d03094ff5894095a38b1792b8' dist/index.html; then exit 1; fi
